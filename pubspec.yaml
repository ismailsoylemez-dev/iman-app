name: iman_uygulamasi
description: Ezan Vakti, Dua ve Zikir Uygulaması
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Ezan vakti hesaplama
  adhan_dart: ^1.2.0

  # Konum bilgisi
  geolocator: ^10.1.1

  # Pusula sensörü
  flutter_compass: ^0.7.0

  # Yerel NoSQL Veritabanı
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Veri kaydetme (Fallback)
  shared_preferences: ^2.2.0

  # Bildirim
  flutter_local_notifications: ^15.1.3

  # State Management
  provider: ^6.0.0

  # İzin yönetimi
  permission_handler: ^11.4.0

  # Zamanlanmış bildirimler için saat dilimi desteği
  timezone: ^0.9.4

  # Medya ve Paylaşım
  audioplayers: ^6.8.1
  share_plus: ^13.3.0

  # Namaz/abdest adım animasyonları
  rive: ^0.13.0

  # Sesli rehber (Türkçe TTS)
  flutter_tts: ^4.2.0

  # Namaz rehberi video denemesi (CDN video embed)
  video_player: ^2.9.2

  # Çevrimiçi/çevrimdışı durum kontrolü
  connectivity_plus: ^6.0.0

  # Hicri takvim dönüşümü
  hijri: ^3.0.0

  # Icon desteği
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  # Ses, görsel ve veri dosyalarını tanıt
  assets:
    - assets/sounds/
    - assets/images/
    - assets/data/
    - assets/animations/
    - assets/audio/quran/
    - assets/audio/dua/

  # Arapça (Amiri) ve arayüz (Manrope) fontları — offline çalışma için asset olarak
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
